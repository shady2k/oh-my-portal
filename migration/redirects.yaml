  muki-vybora-platformy-dlia-blogha:                                 choosing-a-blog-platform
  okazalos-chto-poslie-sozdaniia-blogha-tam-ieshchie-i-pisat-nuzhno: blogging-requires-writing
  javascript-i-monada-maybe:                                         javascript-maybe-monad
