pages:
  # Ghost theme leftovers titled "About this site" — three near-identical stubs.
  /about/:      /about/      # replaced by real content, not redirected
  /about-2/:    /about/
  /about-2-2/:  /about/
  /aboutme/:    /about/      # the only page with a real bio
  /home/:       /
  /author/aleksandr/: /about/  # single-author archive carries nothing extra

tags:
  # The old site had 20 tags for 21 posts: 15 of them held a single post and one
  # held none. That is not a taxonomy, it is keywords in the navigation. A tag
  # earns its place by grouping several posts; anything else belongs in the
  # article's own frontmatter.
  #
  # New set, with post counts:
  #   homelab (7) · pkms (6) · kubernetes (4) · security (3) · ai-agents (3) · blogging (2)
  #
  # Several old tags may point at one new tag — that is what redirects are for.
  ai:                                 ai-agents
  ii-aghient:                         ai-agents
  arkhitiektura:                      ai-agents
  homelab:                            homelab
  mighratsiia:                        homelab
  talos:                              homelab
  talos-linux:                        homelab
  k3s:                                kubernetes
  kubernetes:                         kubernetes
  security:                           security
  sso:                                security
  zerotrust:                          security
  logseq:                             pkms
  pkms:                               pkms
  open-source:                        pkms

orphan_tags:
  # Tags that held exactly one post and have no group to join. Inventing a
  # category of one would be worse than dropping it. Someone who arrives at
  # such a tag from search wanted that one article, so the redirect points
  # straight at it — a listing of one is not worth preserving.
  /tag/kariera/:                        /posts/career-identity-happiness/
  /tag/idientichnost/:                  /posts/career-identity-happiness/
  /tag/lichnost/:                       /posts/career-identity-happiness/
  /tag/schastie/:                       /posts/career-identity-happiness/
  /tag/funktsionalnoie-proghrammirovaniie/: /posts/javascript-maybe-monad/

