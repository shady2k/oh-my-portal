# Redirect map: old Ghost address -> new address.
#
# This file is the single source of truth for the migration. A build step turns
# it into nginx configuration; Astro's own `redirects` config is not used,
# because in static builds it emits meta-refresh HTML and "the status code is
# not used by the server" (Astro docs, Routing / Redirects).
#
# Rules (docs/design/portal.md §5):
#   - 301 only, never 302
#   - exactly one hop; a redirect target must never itself be a redirect
#   - exhaustive: every address present in the old sitemaps appears here
#   - /rss/ is the single exemption and is absent from this file by design
#
# Source: sitemap-{pages,posts,authors,tags}.xml — 49 addresses total.
# Verified against the live site on 2026-09-08.

posts:
